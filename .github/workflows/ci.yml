# Checks every PR (and every push to main): lint and typing, unit tests and integration
# tests. All offline: no test reaches a real site, LLM, SMTP server or Windows Task
# Scheduler.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the previous, now stale, run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint and typing (ruff, mypy)
    # Nothing here depends on the OS; mypy is pinned to win32 in pyproject.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag: an exact version
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (exactly the ones in uv.lock)
        run: uv sync --locked
      - name: ruff — rules
        run: uv run ruff check . --output-format=github
      - name: ruff — formatting
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  unit:
    name: Unit tests
    # Keep Windows-specific behavior covered on its native OS.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag: an exact version
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (exactly the ones in uv.lock)
        run: uv sync --locked
      - name: pytest — unit
        run: uv run pytest -m "not integration"

  linux-unit:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Tk for the desktop imports
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (exactly the ones in uv.lock)
        run: uv sync --locked --python /usr/bin/python3.12
      - name: pytest — unit
        run: uv run pytest -m "not integration"

  linux-package:
    name: Linux release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Tk for the desktop bundle
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group packaging --python /usr/bin/python3.12
      - name: Build and package Linux bundle
        run: bash packaging/build_linux.sh
      - name: Check bundled CLI and archive checksum
        run: |
          ./dist/PeaoBilingue/PeaoBilingue adapters
          version="$(uv version --short)"
          (cd dist && sha256sum -c "PeaoBilingue-linux-x86_64-${version}.tar.gz.sha256")

  integration:
    name: Integration tests
    # Playwright's Chromium, a Tk window, PowerShell and another process: Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag: an exact version
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (exactly the ones in uv.lock)
        run: uv sync --locked
      # Playwright's Chromium changes with the package version, which is in uv.lock.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright's Chromium
        run: uv run playwright install chromium
      - name: pytest — integration
        run: uv run pytest -m integration --durations=25
