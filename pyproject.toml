[project]
name = "peao-bilingue"
version = "0.1.0"
description = "Busca vagas em varios sites, analisa o encaixe com LLMs e avisa por email."
readme = "README.md"
authors = [
    { name = "gabriel vieira", email = "116896794+gvieiragoulart@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.5",
]

[project.scripts]
peao = "peao_bilingue.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
