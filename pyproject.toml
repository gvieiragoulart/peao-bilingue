[project]
name = "peao-bilingue"
version = "0.2.0"
description = "A desktop job radar: collects jobs from several sites, analyzes the fit with LLMs and notifies you."
readme = "README.md"
# Source available, free for noncommercial use; commercial use needs a separate license.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Gabriel Vieira", email = "116896794+gvieiragoulart@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "anthropic>=1.11.0",
    "customtkinter>=6.0.0",
    "filelock>=4.0.12",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.21.1",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.5",
]

[project.scripts]
peao = "peao_bilingue.cli:main"

# gui-script: on Windows it opens with no console window behind it.
[project.gui-scripts]
peao-ui = "peao_bilingue.ui.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Capture at the Python level, not the file descriptor's. The default capture (fd)
# swaps the process's stdout/stderr handles on every test phase; Tcl keeps those handles,
# and Windows recycles the values: the next window failed to read Tcl's own files
# ("Can't find a usable init.tcl"), at random.
addopts = "--capture=sys --strict-markers"
markers = [
    # Unit tests are everything else: fakes, in-memory SQLite, local HTTP.
    "integration: uses a real component outside Python — Chromium (Playwright), a Tk window, another process or PowerShell",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH",
    "BLE", "DTZ", "ISC", "PLE", "PLW", "PT", "ASYNC", "RUF",
]
ignore = [
    "E501",  # line length is the formatter's job; only long texts are left
    # Typographic dashes, quotes and ellipses in the texts are on purpose.
    "RUF001", "RUF002", "RUF003",
    "PT018",  # compound asserts are used on purpose in the tests
]

[tool.ruff.lint.per-file-ignores]
# The environment (data folder, keyring) is set up before importing the project.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# The app is for Windows: the result can't depend on the OS that runs mypy.
platform = "win32"
files = ["src", "tests"]
# The tests import `fakes`, `builders` and `queries` as top-level modules.
mypy_path = "tests"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# CustomTkinter ships no types: its widgets arrive as Any.
module = ["customtkinter", "customtkinter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["peao_bilingue.ui.*"]
disallow_subclassing_any = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
packaging = [
    "pyinstaller>=6.22.3",
]
