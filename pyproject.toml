[project]
name = "peao-bilingue"
version = "0.1.0"
description = "Busca vagas em varios sites, analisa o encaixe com LLMs e avisa por email."
readme = "README.md"
authors = [
    { name = "gabriel vieira", email = "116896794+gvieiragoulart@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "anthropic>=1.11.0",
    "customtkinter>=6.0.0",
    "filelock>=4.0.12",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "tzdata>=2026.5",
]

[project.scripts]
peao = "peao_bilingue.cli:main"

# gui-script: no Windows abre sem a janela de console atrás.
[project.gui-scripts]
peao-ui = "peao_bilingue.ui.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Captura no nível do Python, não do descritor. A captura padrão (fd) troca os
# handles de stdout/stderr do processo a cada fase do teste; o Tcl guarda esses
# handles, e o Windows recicla os valores: a janela seguinte falhava ao ler os
# próprios arquivos do Tcl ("Can't find a usable init.tcl"), de forma aleatória.
addopts = "--capture=sys --strict-markers"
markers = [
    # Testes de unidade são o resto: dublês, SQLite em memória, HTTP local.
    "integracao: usa componente real fora do Python — Chromium (Playwright), janela Tk, outro processo ou o PowerShell",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH",
    "BLE", "DTZ", "ISC", "PLE", "PLW", "PT", "ASYNC", "RUF",
]
ignore = [
    "E501",  # o comprimento é do formatter; sobram só textos longos em PT-BR
    # Travessão, aspas e reticências tipográficos nos textos são de propósito.
    "RUF001", "RUF002", "RUF003",
    "PT018",  # assert composto é usado de propósito nos testes
]

[tool.ruff.lint.per-file-ignores]
# O ambiente (pasta de dados, keyring) é preparado antes de importar o projeto.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# O app é para Windows: o resultado não pode depender do SO de quem roda o mypy.
platform = "win32"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# O CustomTkinter não publica tipos: os widgets dele chegam como Any.
module = ["customtkinter", "customtkinter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["peao_bilingue.ui.*"]
disallow_subclassing_any = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
