AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Peao Bilingue download site: a private S3 bucket served by CloudFront (OAC), the
  role GitHub Actions assumes through OIDC to publish releases and the site, and a
  budget alarm. See infra/README.md.

Parameters:
  GitHubRepository:
    Type: String
    Default: gvieiragoulart/peao-bilingue
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: owner/name of the repository whose workflows may publish.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" when the account already has the token.actions.githubusercontent.com
      OIDC provider (an account can have only one).
  BudgetEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    Description: Who gets the budget alerts.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost (whole account, in USD) that triggers the alerts.
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional custom domain (e.g. peaobilingue.com.br). Used only with
      CertificateArn. The dxxxx.cloudfront.net address keeps working either way.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for DomainName, issued in us-east-1.
  WebAclArn:
    Type: String
    Default: ""
    Description: >-
      The AWS WAF web ACL that CloudFront's flat-rate plan attaches to the
      distribution. Fill it in after subscribing to a plan, so a stack update doesn't
      detach it.

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, "true"]
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  # Installers (releases/, download/), latest.json and the site. Kept when the stack is
  # deleted: it holds every published version.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # An overwritten or deleted object can be brought back for 30 days.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        Description: CloudFront reads the private site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The site loads nothing from elsewhere: no third-party scripts, fonts or analytics.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; img-src 'self' data:; object-src 'none';
              base-uri 'none'; form-action 'none'; frame-ancestors 'none'
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Peao Bilingue download site
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # South America included: most users are in Brazil.
        PriceClass: PriceClass_All
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""  # empty with OAC
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: it honors each object's Cache-Control (installers
          # immutable for a year; latest.json, the alias and the pages for 5 minutes).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # The bucket answers 403 for a missing key (CloudFront may not list it).
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThroughOac
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # GitHub's certificate chain; IAM also trusts it through its own CA library.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Assumed by .github/workflows/release.yml (version tags) and site.yml (main): only
  # this repository, only those refs, only this bucket and distribution.
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: peao-bilingue-release
      Description: GitHub Actions publishes the installers and the site.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepository}:ref:refs/tags/v*"
                  - !Sub "repo:${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Objects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # A safety net for the whole account, not only this stack.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  BucketName:
    Description: Repository variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Repository variable SITE_DISTRIBUTION_ID.
    Value: !Ref Distribution
  SiteUrl:
    Description: >-
      Repository variable SITE_URL, and SITE_URL in src/peao_bilingue/config.py (and
      the README's link). It never changes, even with a custom domain.
    Value: !Sub "https://${Distribution.DomainName}"
  CustomDomainUrl:
    Condition: HasDomain
    Description: The custom domain, once configured.
    Value: !Sub "https://${DomainName}"
  ReleaseRoleArn:
    Description: Repository variable AWS_RELEASE_ROLE_ARN.
    Value: !GetAtt ReleaseRole.Arn
